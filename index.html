<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0,
maximum-scale=1.0, user-scalable=no">

<title>SKY BIRD</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    touch-action:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
}

#game{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    display:block;
}

#rotate{
    position:fixed;
    inset:0;
    z-index:1000;
    display:none;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:#111;
    color:white;
    font-size:25px;
    font-weight:bold;
    padding:20px;
}

@media (orientation:portrait){
    #rotate{
        display:flex;
    }

    #menu,
    #gameOver,
    #score,
    #coinHud{
        visibility:hidden;
    }
}

#menu{
    position:fixed;
    inset:0;
    z-index:10;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    background:linear-gradient(#58c8e8,#b9f2ff);

    overflow:auto;
}

#menu h1{
    color:white;
    font-size:clamp(42px,8vw,75px);
    text-shadow:4px 4px #333;
    margin-bottom:5px;
}

#menu p{
    color:#333;
    font-weight:bold;
    margin:5px;
}

#skins{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:7px;
    max-width:900px;
    padding:8px;
}

.skin{
    min-width:115px;
    padding:9px 10px;

    border:3px solid white;
    border-radius:12px;

    background:#222;
    color:white;

    font-size:15px;
    font-weight:bold;
}

.skin.selected{
    border-color:#ffe600;
    box-shadow:0 0 15px #ffe600;
}

.skin.locked{
    opacity:.4;
}

#mapBox{
    display:flex;
    gap:8px;
    margin:6px;
}

.mapButton{
    padding:10px 18px;
    border:3px solid white;
    border-radius:12px;
    background:#222;
    color:white;
    font-weight:bold;
    font-size:16px;
}

.mapButton.selected{
    border-color:#ffe600;
    box-shadow:0 0 12px #ffe600;
}

.mapButton.locked{
    opacity:.4;
}

.button{
    margin-top:10px;
    padding:13px 40px;

    border:0;
    border-radius:15px;

    background:#35b84a;
    color:white;

    font-size:23px;
    font-weight:bold;
}

#score{
    position:fixed;
    z-index:5;
    top:12px;
    left:50%;
    transform:translateX(-50%);

    display:none;

    color:white;
    font-size:clamp(30px,5vw,55px);
    font-weight:bold;
    text-shadow:4px 4px #333;
}

#coinHud{
    position:fixed;
    z-index:5;
    top:15px;
    left:18px;

    display:none;

    color:white;
    font-size:21px;
    font-weight:bold;
    text-shadow:3px 3px #333;
}

#gameOver{
    position:fixed;
    inset:0;
    z-index:20;

    display:none;

    flex-direction:column;
    justify-content:center;
    align-items:center;

    background:rgba(0,0,0,.6);
    color:white;
}

#gameOver h2{
    font-size:clamp(45px,8vw,70px);
    text-shadow:4px 4px #000;
}

#gameOver p{
    font-size:22px;
    margin:6px;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="rotate">
    📱<br><br>
    VIRE O CELULAR DE LADO<br>
    PARA JOGAR SKY BIRD
</div>

<div id="score">0</div>

<div id="coinHud">
    🪙 <span id="coins">0</span>
</div>

<div id="menu">

    <h1>🐦 SKY BIRD</h1>

    <p>Escolha seu pássaro</p>

    <p>
        🏆 Recorde:
        <span id="best">0</span>
        &nbsp;&nbsp;
        🪙:
        <span id="totalCoins">0</span>
    </p>

    <div id="skins"></div>

    <p>Escolha o mapa</p>

    <div id="mapBox"></div>

    <button class="button" id="start">
        JOGAR
    </button>

</div>

<div id="gameOver">

    <h2>GAME OVER</h2>

    <p>
        Pontuação:
        <span id="finalScore">0</span>
    </p>

    <p>
        Recorde:
        <span id="finalBest">0</span>
    </p>

    <p>
        🪙 Moedas:
        <span id="finalCoins">0</span>
    </p>

    <button class="button" id="restart">
        JOGAR NOVAMENTE
    </button>

    <button class="button" id="backMenu">
        MENU
    </button>

</div>

<script>

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

let W = 0;
let H = 0;

function resize(){

    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;

}

resize();

window.addEventListener("resize",resize);


/* =========================
   SKINS ORIGINAIS
========================= */

const skins = [

    {
        name:"🐦 Comum",
        unlock:0,
        type:"normal",
        body:"#ffd21f",
        wing:"#e5aa00"
    },

    {
        name:"🦸 Herói",
        unlock:100,
        type:"hero",
        body:"#2878ff",
        wing:"#1652b5"
    },

    {
        name:"🔥 Fênix",
        unlock:300,
        type:"phoenix",
        body:"#ff4b16",
        wing:"#c83200"
    },

    {
        name:"🤖 Robô",
        unlock:500,
        type:"robot",
        body:"#9da5ad",
        wing:"#626970"
    },

    {
        name:"👽 Alien",
        unlock:1000,
        type:"alien",
        body:"#65ff50",
        wing:"#269e28"
    },

    {
        name:"🌑 Sombrio",
        unlock:2000,
        type:"dark",
        body:"#292333",
        wing:"#15111c"
    },

    {
        name:"🍩 Rosquinha",
        unlock:2500,
        type:"donut",
        body:"#ffd21f",
        wing:"#e5aa00"
    },

    {
        name:"🧇 Waffle",
        unlock:3000,
        type:"waffle",
        body:"#ffd21f",
        wing:"#e5aa00"
    },

    {
        name:"🎅 Natal",
        unlock:50,
        type:"christmas",
        coins:true,
        body:"#ffd21f",
        wing:"#e5aa00"
    },

    {
        name:"🎃 Halloween",
        unlock:50,
        type:"halloween",
        coins:true,
        body:"#ff8c00",
        wing:"#c65c00"
    },

    {
        name:"🥳 Ano Novo",
        unlock:50,
        type:"newyear",
        coins:true,
        body:"#ffd21f",
        wing:"#e5aa00"
    }

];


let bestScore =
    Number(localStorage.getItem("skyBest") || 0);

let totalCoins =
    Number(localStorage.getItem("skyCoins") || 0);

let selectedSkin =
    Number(localStorage.getItem("skySkin") || 0);

let selectedMap =
    localStorage.getItem("skyMap") || "normal";


if(
    !skins[selectedSkin] ||
    (
        !skins[selectedSkin].coins &&
        bestScore < skins[selectedSkin].unlock
    ) ||
    (
        skins[selectedSkin].coins &&
        totalCoins < skins[selectedSkin].unlock
    )
){
    selectedSkin = 0;
}


/* =========================
   SALVAR
========================= */

function save(){

    localStorage.setItem(
        "skyBest",
        bestScore
    );

    localStorage.setItem(
        "skyCoins",
        totalCoins
    );

    localStorage.setItem(
        "skySkin",
        selectedSkin
    );

    localStorage.setItem(
        "skyMap",
        selectedMap
    );

}


/* =========================
   MENU SKINS
========================= */

function createSkins(){

    const box =
        document.getElementById("skins");

    box.innerHTML = "";

    skins.forEach((skin,index)=>{

        const button =
            document.createElement("button");

        button.className = "skin";

        const unlocked =
            skin.coins
            ? totalCoins >= skin.unlock
            : bestScore >= skin.unlock;

        if(index === selectedSkin)
            button.classList.add("selected");

        if(!unlocked)
            button.classList.add("locked");

        if(unlocked){

            button.textContent =
                skin.name;

            button.onclick = function(){

                selectedSkin = index;

                save();

                createSkins();

            };

        }else{

            button.textContent =
                skin.name +
                " 🔒 " +
                skin.unlock +
                (skin.coins ? " 🪙" : "");

        }

        box.appendChild(button);

    });

    document.getElementById("best").textContent =
        bestScore;

    document.getElementById("totalCoins").textContent =
        totalCoins;

}


/* =========================
   MAPAS
========================= */

function createMaps(){

    const box =
        document.getElementById("mapBox");

    box.innerHTML = "";

    const normal =
        document.createElement("button");

    normal.className = "mapButton";

    normal.textContent =
        "🌳 Normal";

    if(selectedMap === "normal")
        normal.classList.add("selected");

    normal.onclick = function(){

        selectedMap = "normal";

        save();

        createMaps();

    };

    box.appendChild(normal);


    const desert =
        document.createElement("button");

    desert.className = "mapButton";

    if(bestScore >= 2000){

        desert.textContent =
            "🏜️ Deserto";

        if(selectedMap === "desert")
            desert.classList.add("selected");

        desert.onclick = function(){

            selectedMap = "desert";

            save();

            createMaps();

        };

    }else{

        desert.textContent =
            "🏜️ Deserto 🔒 2000";

        desert.classList.add("locked");

    }

    box.appendChild(desert);

}


createSkins();
createMaps();


/* =========================
   JOGO
========================= */

let bird;

let normalClouds = [];
let fatalClouds = [];
let coins = [];
let particles = [];

let score = 0;
let runCoins = 0;

let playing = false;

let lastTime = 0;
let gameTime = 0;

let cloudTimer = 0;
let fatalTimer = 0;
let coinTimer = 0;


/* =========================
   RESET
========================= */

function resetGame(){

    bird = {

        x:W * .23,

        y:H * .45,

        velocity:0,

        radius:
            Math.max(
                22,
                Math.min(W,H) * .055
            ),

        rotation:0

    };

    normalClouds = [];
    fatalClouds = [];
    coins = [];
    particles = [];

    score = 0;
    runCoins = 0;

    gameTime = 0;

    cloudTimer = .2;
    fatalTimer = 2.5;
    coinTimer = .8;

    document.getElementById("score").textContent =
        "0";

    document.getElementById("coins").textContent =
        "0";

}


/* =========================
   TELA CHEIA + PAISAGEM
========================= */

async function enterFullscreen(){

    try{

        if(!document.fullscreenElement){

            await document.documentElement.requestFullscreen();

        }

    }catch(e){}

    try{

        if(screen.orientation &&
           screen.orientation.lock){

            await screen.orientation.lock("landscape");

        }

    }catch(e){}

}


/* =========================
   COMEÇAR
========================= */

async function startGame(){

    await enterFullscreen();

    resetGame();

    document.getElementById("menu").style.display =
        "none";

    document.getElementById("gameOver").style.display =
        "none";

    document.getElementById("score").style.display =
        "block";

    document.getElementById("coinHud").style.display =
        "block";

    playing = true;

    lastTime = performance.now();

    requestAnimationFrame(gameLoop);

}


/* =========================
   PULO
========================= */

function flap(){

    if(!playing) return;

    bird.velocity = -390;

    bird.rotation = -0.5;

}


/* =========================
   CONTROLES
========================= */

canvas.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        flap();

    }
);

document.addEventListener(
    "keydown",
    function(e){

        if(
            e.code === "Space" ||
            e.code === "ArrowUp"
        ){

            e.preventDefault();

            flap();

        }

    }
);


document.getElementById("start").onclick =
    startGame;

document.getElementById("restart").onclick =
    startGame;


document.getElementById("backMenu").onclick =
function(){

    playing = false;

    document.getElementById("gameOver").style.display =
        "none";

    document.getElementById("menu").style.display =
        "flex";

    createSkins();
    createMaps();

    resetGame();

    draw();

};


/* =========================
   NUVENS
========================= */

function createNormalCloud(){

    normalClouds.push({

        x:W + 100,

        y:
            70 +
            Math.random() *
            (H * .60),

        size:
            25 +
            Math.random() * 20,

        speed:
            45 +
            Math.random() * 25

    });

}


function createFatalCloud(){

    fatalClouds.push({

        x:W + 120,

        y:
            70 +
            Math.random() *
            (H * .60),

        size:
            38 +
            Math.random() * 12,

        speed:
            90 +
            Math.random() * 30,

        pulse:0

    });

}


function createCoin(){

    coins.push({

        x:W + 50,

        y:
            70 +
            Math.random() *
            (H * .62),

        radius:15,

        spin:
            Math.random() *
            Math.PI * 2

    });

}


/* =========================
   PARTÍCULAS
========================= */

function particlesAt(x,y,amount,color){

    for(let i=0;i<amount;i++){

        particles.push({

            x:x,
            y:y,

            vx:
                (Math.random()-.5)*160,

            vy:
                (Math.random()-.5)*160,

            life:.5,

            color:color

        });

    }

}


/* =========================
   ATUALIZAR
========================= */

function update(delta){

    delta = Math.min(delta,.035);

    gameTime += delta;


    bird.velocity +=
        1150 * delta;

    bird.y +=
        bird.velocity * delta;

    bird.rotation +=
        2 * delta;

    bird.rotation =
        Math.min(
            1,
            bird.rotation
        );


    cloudTimer -= delta;
    fatalTimer -= delta;
    coinTimer -= delta;


    if(cloudTimer <= 0){

        createNormalCloud();

        cloudTimer =
            1.2 +
            Math.random()*1.5;

    }


    if(fatalTimer <= 0){

        createFatalCloud();

        fatalTimer =
            2.2 +
            Math.random()*1.8;

    }


    if(coinTimer <= 0){

        createCoin();

        coinTimer =
            .8 +
            Math.random()*1.2;

    }


    const speed =
        1 +
        Math.min(
            1.5,
            score/100
        );


    for(const cloud of normalClouds){

        cloud.x -=
            cloud.speed *
            delta *
            speed;

    }


    for(const cloud of fatalClouds){

        cloud.x -=
            cloud.speed *
            delta *
            speed;

        cloud.pulse +=
            delta*5;

    }


    for(const coin of coins){

        coin.x -=
            190 *
            delta *
            speed;

        coin.spin +=
            delta*7;

    }


    for(
        let i=coins.length-1;
        i>=0;
        i--
    ){

        const coin = coins[i];

        const distance =
            Math.hypot(
                bird.x-coin.x,
                bird.y-coin.y
            );

        if(
            distance <
            bird.radius+coin.radius
        ){

            runCoins++;

            document.getElementById("coins").textContent =
                runCoins;

            particlesAt(
                coin.x,
                coin.y,
                10,
                "#ffe600"
            );

            coins.splice(i,1);

        }
        else if(coin.x < -60){

            coins.splice(i,1);

        }

    }


    for(const cloud of fatalClouds){

        const distance =
            Math.hypot(
                bird.x-cloud.x,
                bird.y-cloud.y
            );

        if(
            distance <
            bird.radius +
            cloud.size*.72
        ){

            particlesAt(
                bird.x,
                bird.y,
                20,
                "#ff3333"
            );

            endGame();

            return;

        }

    }


    normalClouds =
        normalClouds.filter(
            c => c.x > -150
        );

    fatalClouds =
        fatalClouds.filter(
            c => c.x > -150
        );


    for(
        let i=particles.length-1;
        i>=0;
        i--
    ){

        const p = particles[i];

        p.x += p.vx*delta;
        p.y += p.vy*delta;
        p.life -= delta;

        if(p.life <= 0)
            particles.splice(i,1);

    }


    if(
        bird.y-bird.radius < 0 ||
        bird.y+bird.radius > H-45
    ){

        endGame();

        return;

    }


    score =
        Math.floor(
            gameTime*5
        );

    document.getElementById("score").textContent =
        score;

}


/* =========================
   FUNDO
========================= */

function drawBackground(){

    if(selectedMap === "desert"){

        const gradient =
            ctx.createLinearGradient(
                0,0,0,H
            );

        gradient.addColorStop(
            0,
            "#e89b48"
        );

        gradient.addColorStop(
            1,
            "#ffd98a"
        );

        ctx.fillStyle = gradient;

        ctx.fillRect(
            0,0,W,H
        );


        /* SOL */

        ctx.fillStyle =
            "#fff1a8";

        ctx.beginPath();

        ctx.arc(
            W*.82,
            H*.18,
            42,
            0,
            Math.PI*2
        );

        ctx.fill();


        /* AREIA */

        ctx.fillStyle =
            "#d89b45";

        ctx.fillRect(
            0,
            H-45,
            W,
            45
        );


        /* DUNAS */

        ctx.fillStyle =
            "#c78332";

        ctx.beginPath();

        ctx.moveTo(0,H-45);
        ctx.quadraticCurveTo(
            W*.2,H-100,
            W*.4,H-45
        );

        ctx.quadraticCurveTo(
            W*.65,H-95,
            W,H-45
        );

        ctx.lineTo(W,H);
        ctx.lineTo(0,H);
        ctx.fill();

    }else{

        const gradient =
            ctx.createLinearGradient(
                0,0,0,H
            );

        gradient.addColorStop(
            0,
            "#58c8e8"
        );

        gradient.addColorStop(
            1,
            "#b9f2ff"
        );

        ctx.fillStyle = gradient;

        ctx.fillRect(
            0,0,W,H
        );


        /* SOL */

        ctx.fillStyle =
            "#ffe36b";

        ctx.beginPath();

        ctx.arc(
            W*.82,
            H*.16,
            38,
            0,
            Math.PI*2
        );

        ctx.fill();


        /* CHÃO */

        ctx.fillStyle =
            "#79c94a";

        ctx.fillRect(
            0,
            H-45,
            W,
            45
        );

    }

}


/* =========================
   NUVEM NORMAL
========================= */

function drawNormalCloud(cloud){

    ctx.save();

    ctx.translate(
        cloud.x,
        cloud.y
    );

    ctx.fillStyle =
        "rgba(255,255,255,.9)";

    ctx.beginPath();

    ctx.arc(
        -40,
        8,
        cloud.size*.65,
        0,
        Math.PI*2
    );

    ctx.arc(
        -10,
        -10,
        cloud.size*.9,
        0,
        Math.PI*2
    );

    ctx.arc(
        25,
        4,
        cloud.size*.75,
        0,
        Math.PI*2
    );

    ctx.arc(
        48,
        12,
        cloud.size*.5,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();

}


/* =========================
   NUVEM FATAL
========================= */

function drawFatalCloud(cloud){

    ctx.save();

    ctx.translate(
        cloud.x,
        cloud.y +
        Math.sin(cloud.pulse)*3
    );

    ctx.shadowColor =
        "#ff3030";

    ctx.shadowBlur = 15;

    ctx.fillStyle =
        "#5a5a66";

    ctx.strokeStyle =
        "#292933";

    ctx.lineWidth = 5;

    ctx.beginPath();

    ctx.arc(
        -40,
        8,
        cloud.size*.65,
        0,
        Math.PI*2
    );

    ctx.arc(
        -10,
        -10,
        cloud.size*.9,
        0,
        Math.PI*2
    );

    ctx.arc(
        25,
        4,
        cloud.size*.75,
        0,
        Math.PI*2
    );

    ctx.arc(
        48,
        12,
        cloud.size*.5,
        0,
        Math.PI*2
    );

    ctx.fill();
    ctx.stroke();

    ctx.shadowBlur = 0;

    /* OLHOS */

    ctx.fillStyle =
        "#ff3333";

    ctx.beginPath();

    ctx.arc(
        -17,
        2,
        6,
        0,
        Math.PI*2
    );

    ctx.arc(
        23,
        2,
        6,
        0,
        Math.PI*2
    );

    ctx.fill();

    /* BOCA */

    ctx.strokeStyle =
        "#ff3333";

    ctx.lineWidth = 4;

    ctx.beginPath();

    ctx.moveTo(-22,22);

    ctx.quadraticCurveTo(
        2,37,
        27,21
    );

    ctx.stroke();

    ctx.restore();

}


/* =========================
   MOEDA
========================= */

function drawCoin(coin){

    ctx.save();

    ctx.translate(
        coin.x,
        coin.y
    );

    const scale =
        Math.abs(
            Math.cos(
                coin.spin
            )
        );

    ctx.scale(
        Math.max(.25,scale),
        1
    );

    ctx.fillStyle =
        "#ffd21f";

    ctx.strokeStyle =
        "#b57b00";

    ctx.lineWidth = 3;

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        coin.radius,
        0,
        Math.PI*2
    );

    ctx.fill();
    ctx.stroke();

    ctx.fillStyle =
        "#fff3a0";

    ctx.font =
        "bold 15px Arial";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.fillText(
        "$",
        0,
        1
    );

    ctx.restore();

}


/* =========================
   PÁSSARO
   DESIGN ORIGINAL
========================= */

function drawBird(){

    const skin =
        skins[selectedSkin];

    const r =
        bird.radius;

    ctx.save();

    ctx.translate(
        bird.x,
        bird.y
    );

    ctx.rotate(
        bird.rotation
    );


    /* FÊNIX ORIGINAL */

    if(skin.type === "phoenix"){

        ctx.fillStyle =
            "#ff7a00";

        ctx.beginPath();

        ctx.moveTo(
            -r*.3,
            r*.3
        );

        ctx.lineTo(
            -r*1.8,
            r*1.3
        );

        ctx.lineTo(
            -r*1.1,
            0
        );

        ctx.lineTo(
            -r*1.8,
            -r
        );

        ctx.lineTo(
            -r*.3,
            -r*.2
        );

        ctx.fill();

    }


    /* SOMBRIO ORIGINAL */

    if(skin.type === "dark"){

        ctx.shadowColor =
            "#8b55ff";

        ctx.shadowBlur = 18;

    }


    /* CORPO ORIGINAL */

    ctx.fillStyle =
        skin.body;

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        r,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.shadowBlur = 0;


    /* ASA ORIGINAL */

    ctx.fillStyle =
        skin.wing;

    ctx.beginPath();

    ctx.ellipse(
        -r*.3,
        r*.35,
        r*.75,
        r*.38,
        -.3,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* CAPA ORIGINAL */

    if(skin.type === "hero"){

        ctx.fillStyle =
            "#e21b23";

        ctx.beginPath();

        ctx.moveTo(
            -r*.2,
            r*.2
        );

        ctx.lineTo(
            -r*1.7,
            r*1.2
        );

        ctx.lineTo(
            -r,
            0
        );

        ctx.fill();

    }


    /* ROBÔ ORIGINAL */

    if(skin.type === "robot"){

        ctx.strokeStyle =
            "#333";

        ctx.lineWidth = 3;

        ctx.strokeRect(
            -r*.65,
            -r*.65,
            r*1.3,
            r*1.3
        );

        ctx.fillStyle =
            "#ff3333";

        ctx.beginPath();

        ctx.arc(
            r*.35,
            -r*.2,
            r*.12,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    /* ALIEN ORIGINAL */

    if(skin.type === "alien"){

        ctx.fillStyle =
            "#111";

        ctx.beginPath();

        ctx.ellipse(
            r*.35,
            -r*.2,
            r*.22,
            r*.35,
            -.3,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    /* 🍩 ROSQUINHA */

    if(skin.type === "donut"){

        ctx.fillStyle =
            "#d88945";

        ctx.beginPath();

        ctx.arc(
            0,
            -r*1.05,
            r*.58,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.fillStyle =
            "#ff8acb";

        ctx.beginPath();

        ctx.arc(
            0,
            -r*1.05,
            r*.43,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.fillStyle =
            skin.body;

        ctx.beginPath();

        ctx.arc(
            0,
            -r*1.05,
            r*.16,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    /* 🧇 WAFFLE */

    if(skin.type === "waffle"){

        ctx.fillStyle =
            "#d89a38";

        ctx.strokeStyle =
            "#9a641d";

        ctx.lineWidth = 3;

        ctx.beginPath();

        ctx.roundRect(
            -r*.65,
            -r*1.55,
            r*1.3,
            r*.75,
            10
        );

        ctx.fill();
        ctx.stroke();

        ctx.strokeStyle =
            "#f0c15a";

        ctx.lineWidth = 3;

        for(let i=-2;i<=2;i++){

            ctx.beginPath();

            ctx.moveTo(
                i*r*.25-r*.05,
                -r*1.48
            );

            ctx.lineTo(
                i*r*.25-r*.05,
                -r*.88
            );

            ctx.stroke();

        }

        for(let i=-1;i<=1;i++){

            ctx.beginPath();

            ctx.moveTo(
                -r*.58,
                -r*1.25+i*r*.25
            );

            ctx.lineTo(
                r*.58,
                -r*1.25+i*r*.25
            );

            ctx.stroke();

        }

    }


    /* 🎅 NATAL */

    if(skin.type === "christmas"){

        ctx.fillStyle =
            "#d71920";

        ctx.beginPath();

        ctx.moveTo(
            -r*.65,
            -r*.65
        );

        ctx.lineTo(
            r*.6,
            -r*1.25
        );

        ctx.lineTo(
            r*.55,
            -r*.7
        );

        ctx.lineTo(
            -r*.55,
            -.1
        );

        ctx.closePath();

        ctx.fill();

        ctx.fillStyle =
            "white";

        ctx.beginPath();

        ctx.arc(
            r*.62,
            -r*1.25,
            r*.13,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.fillRect(
            -r*.65,
            -r*.75,
            r*1.2,
            r*.15
        );

    }


    /* 🎃 HALLOWEEN */

    if(skin.type === "halloween"){

        ctx.fillStyle =
            "#171717";

        ctx.beginPath();

        ctx.moveTo(
            -r*.7,
            -r*.7
        );

        ctx.lineTo(
            r*.7,
            -r*.7
        );

        ctx.lineTo(
            0,
            -r*1.45
        );

        ctx.closePath();

        ctx.fill();

        ctx.fillStyle =
            "#ff7a00";

        ctx.beginPath();

        ctx.arc(
            0,
            -r*.85,
            r*.22,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    /* 🥳 ANO NOVO */

    if(skin.type === "newyear"){

        ctx.fillStyle =
            "#8c45ff";

        ctx.beginPath();

        ctx.arc(
            0,
            -r*1.05,
            r*.55,
            Math.PI,
            Math.PI*2
        );

        ctx.fill();

        ctx.fillStyle =
            "#ffe600";

        for(let i=0;i<5;i++){

            ctx.beginPath();

            ctx.arc(
                -r*.4+i*r*.2,
                -r*1.15,
                r*.06,
                0,
                Math.PI*2
            );

            ctx.fill();

        }

    }


    /* OLHO ORIGINAL */

    ctx.fillStyle =
        "white";

    ctx.beginPath();

    ctx.arc(
        r*.45,
        -r*.3,
        r*.28,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle =
        "#111";

    ctx.beginPath();

    ctx.arc(
        r*.52,
        -r*.3,
        r*.12,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* BICO ORIGINAL */

    ctx.fillStyle =
        "#ff8c00";

    ctx.beginPath();

    ctx.moveTo(
        r*.75,
        0
    );

    ctx.lineTo(
        r*1.55,
        r*.2
    );

    ctx.lineTo(
        r*.75,
        r*.4
    );

    ctx.closePath();

    ctx.fill();

    ctx.restore();

}


/* =========================
   DESENHAR
========================= */

function draw(){

    drawBackground();

    for(const cloud of normalClouds)
        drawNormalCloud(cloud);

    for(const cloud of fatalClouds)
        drawFatalCloud(cloud);

    for(const coin of coins)
        drawCoin(coin);

    for(const p of particles){

        ctx.globalAlpha =
            Math.max(0,p.life*2);

        ctx.fillStyle =
            p.color;

        ctx.fillRect(
            p.x,
            p.y,
            5,
            5
        );

    }

    ctx.globalAlpha = 1;

    drawBird();

}


/* =========================
   LOOP
========================= */

function gameLoop(now){

    if(!playing) return;

    const delta =
        (now-lastTime)/1000;

    lastTime = now;

    update(delta);

    draw();

    if(playing){

        requestAnimationFrame(
            gameLoop
        );

    }

}


/* =========================
   GAME OVER
========================= */

function endGame(){

    if(!playing) return;

    playing = false;


    if(score > bestScore){

        bestScore = score;

    }


    totalCoins +=
        runCoins;


    save();


    document.getElementById("finalScore").textContent =
        score;

    document.getElementById("finalBest").textContent =
        bestScore;

    document.getElementById("finalCoins").textContent =
        runCoins;


    document.getElementById("score").style.display =
        "none";

    document.getElementById("coinHud").style.display =
        "none";

    document.getElementById("gameOver").style.display =
        "flex";


    createSkins();
    createMaps();

}


/* =========================
   INICIAL
========================= */

resetGame();

draw();

</script>
