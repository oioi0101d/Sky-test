/* ==================================================
   CANVAS
================================================== */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

let W = 0;
let H = 0;

function resize(){

    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;

}

resize();

window.addEventListener(
    "resize",
    resize
);


/* ==================================================
   SKINS
================================================== */

const skins = [

    {
        name:"🐦 Comum",
        unlock:0,
        cost:0,
        body:"#ffd21f",
        wing:"#e5aa00"
    },

    {
        name:"🦸 Herói",
        unlock:100,
        cost:0,
        body:"#2878ff",
        wing:"#1652b5"
    },

    {
        name:"🔥 Fênix",
        unlock:300,
        cost:0,
        body:"#ff4b16",
        wing:"#c83200"
    },

    {
        name:"🤖 Robô",
        unlock:500,
        cost:0,
        body:"#9da5ad",
        wing:"#626970"
    },

    {
        name:"👽 Alien",
        unlock:1000,
        cost:0,
        body:"#65ff50",
        wing:"#269e28"
    },

    {
        name:"🌑 Sombrio",
        unlock:2000,
        cost:0,
        body:"#292333",
        wing:"#15111c"
    },

    {
        name:"🍩 Rosquinha",
        unlock:2500,
        cost:0,
        body:"#ff9b45",
        wing:"#d76b22"
    },

    {
        name:"🧇 Waffle",
        unlock:3000,
        cost:0,
        body:"#e5a33a",
        wing:"#b96e20"
    },

    {
        name:"🎅 Natal",
        unlock:0,
        cost:50,
        body:"#e52323",
        wing:"#ffffff"
    },

    {
        name:"🎃 Halloween",
        unlock:0,
        cost:50,
        body:"#ff7417",
        wing:"#6b2bb5"
    },

    {
        name:"🥳 Ano Novo",
        unlock:0,
        cost:50,
        body:"#ffd21f",
        wing:"#ff55c8"
    }

];


/* ==================================================
   DADOS SALVOS
================================================== */

let bestScore =
    Number(
        localStorage.getItem("skyBest") || 0
    );

let totalCoins =
    Number(
        localStorage.getItem("skyCoins") || 0
    );

let selectedSkin =
    Number(
        localStorage.getItem("skySkin") || 0
    );

let selectedMap =
    localStorage.getItem("skyMap") || "normal";


if(
    !skins[selectedSkin]
){
    selectedSkin = 0;
}


/* ==================================================
   SALVAR
================================================== */

function save(){

    localStorage.setItem(
        "skyBest",
        bestScore
    );

    localStorage.setItem(
        "skyCoins",
        totalCoins
    );

    localStorage.setItem(
        "skySkin",
        selectedSkin
    );

    localStorage.setItem(
        "skyMap",
        selectedMap
    );

}


/* ==================================================
   MENU DAS SKINS
================================================== */

function createSkins(){

    const box =
        document.getElementById("skins");

    box.innerHTML = "";


    skins.forEach(
        (skin,index)=>{

            const button =
                document.createElement("button");

            button.className = "skin";


            let unlocked = false;


            /* Skins normais */

            if(skin.cost === 0){

                unlocked =
                    bestScore >= skin.unlock;

            }


            /* Skins de evento */

            if(skin.cost > 0){

                unlocked =
                    totalCoins >= skin.cost;

            }


            if(index === selectedSkin){

                button.classList.add(
                    "selected"
                );

            }


            if(!unlocked){

                button.classList.add(
                    "locked"
                );

            }


            if(unlocked){

                button.textContent =
                    skin.name +
                    " ✓";


                button.onclick =
                    function(){

                        selectedSkin =
                            index;

                        save();

                        createSkins();

                    };

            }else{

                if(skin.cost > 0){

                    button.textContent =
                        skin.name +
                        " 🔒 " +
                        skin.cost +
                        " 🪙";

                }else{

                    button.textContent =
                        skin.name +
                        " 🔒 " +
                        skin.unlock;

                }

            }


            box.appendChild(
                button
            );

        }
    );


    document.getElementById(
        "best"
    ).textContent =
        bestScore;


    document.getElementById(
        "totalCoins"
    ).textContent =
        totalCoins;

}


/* ==================================================
   MAPA
================================================== */

function updateMapButton(){

    const button =
        document.getElementById(
            "mapButton"
        );


    if(bestScore < 2000){

        selectedMap = "normal";

        button.textContent =
            "🌤️ MAPA NORMAL 🔒 🌵 2000";

        button.classList.add(
            "locked"
        );

        return;

    }


    button.classList.remove(
        "locked"
    );


    if(selectedMap === "desert"){

        button.textContent =
            "🌵 DESERTO ✓";

    }else{

        button.textContent =
            "🌤️ MAPA NORMAL ✓";

    }

}


document.getElementById(
    "mapButton"
).onclick =
function(){

    if(bestScore < 2000){

        selectedMap = "normal";

        updateMapButton();

        return;

    }


    if(selectedMap === "normal"){

        selectedMap = "desert";

    }else{

        selectedMap = "normal";

    }


    save();

    updateMapButton();

};


createSkins();

updateMapButton();


/* ==================================================
   JOGO
================================================== */

let bird;

let normalClouds = [];
let fatalClouds = [];
let coins = [];
let particles = [];

let score = 0;
let runCoins = 0;

let playing = false;

let lastTime = 0;
let gameTime = 0;

let cloudTimer = 0;
let fatalTimer = 0;
let coinTimer = 0;


/* ==================================================
   RESET
================================================== */

function resetGame(){

    bird = {

        x:W * .23,

        y:H * .45,

        velocity:0,

        radius:
            Math.max(
                22,
                Math.min(W,H) * .055
            ),

        rotation:0

    };


    normalClouds = [];
    fatalClouds = [];
    coins = [];
    particles = [];


    score = 0;

    runCoins = 0;

    gameTime = 0;


    cloudTimer = .2;
    fatalTimer = 2.5;
    coinTimer = .8;


    document.getElementById(
        "score"
    ).textContent =
        "0";


    document.getElementById(
        "coins"
    ).textContent =
        "0";

}


/* ==================================================
   TELA CHEIA
================================================== */

async function enterFullscreen(){

    try{

        if(
            !document.fullscreenElement &&
            document.documentElement.requestFullscreen
        ){

            await document.documentElement.requestFullscreen();

        }

    }catch(e){

        console.log(
            "Fullscreen não disponível",
            e
        );

    }


    try{

        if(
            screen.orientation &&
            screen.orientation.lock
        ){

            await screen.orientation.lock(
                "landscape"
            );

        }

    }catch(e){

        console.log(
            "Orientação automática não disponível"
        );

    }

}


/* ==================================================
   COMEÇAR
================================================== */

async function startGame(){

    await enterFullscreen();


    resetGame();


    document.getElementById(
        "menu"
    ).style.display =
        "none";


    document.getElementById(
        "gameOver"
    ).style.display =
        "none";


    document.getElementById(
        "score"
    ).style.display =
        "block";


    document.getElementById(
        "coinHud"
    ).style.display =
        "block";


    playing = true;


    lastTime =
        performance.now();


    requestAnimationFrame(
        gameLoop
    );

}


/* ==================================================
   PULO
================================================== */

function flap(){

    if(!playing) return;

    bird.velocity =
        -390;

    bird.rotation =
        -0.5;

}


/* ==================================================
   CONTROLES
================================================== */

canvas.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        flap();

    }
);


document.addEventListener(
    "keydown",
    function(e){

        if(
            e.code === "Space" ||
            e.code === "ArrowUp"
        ){

            e.preventDefault();

            flap();

        }

    }
);


document.getElementById(
    "start"
).onclick =
startGame;


document.getElementById(
    "restart"
).onclick =
startGame;


/* ==================================================
   MENU
================================================== */

document.getElementById(
    "backMenu"
).onclick =
function(){

    playing = false;


    document.getElementById(
        "gameOver"
    ).style.display =
        "none";


    document.getElementById(
        "menu"
    ).style.display =
        "flex";


    document.getElementById(
        "score"
    ).style.display =
        "none";


    document.getElementById(
        "coinHud"
    ).style.display =
        "none";


    createSkins();

    updateMapButton();

    resetGame();

    draw();

};


/* ==================================================
   NUVEM NORMAL
================================================== */

function createNormalCloud(){

    normalClouds.push({

        x:W + 120,

        y:
            70 +
            Math.random() *
            (H * .60),

        size:
            25 +
            Math.random() * 20,

        speed:
            45 +
            Math.random() * 25

    });

}


/* ==================================================
   NUVEM FATAL
================================================== */

function createFatalCloud(){

    fatalClouds.push({

        x:W + 140,

        y:
            70 +
            Math.random() *
            (H * .60),

        size:
            38 +
            Math.random() * 12,

        speed:
            90 +
            Math.random() * 30,

        pulse:0

    });

}


/* ==================================================
   MOEDA
================================================== */

function createCoin(){

    coins.push({

        x:W + 50,

        y:
            70 +
            Math.random() *
            (H * .62),

        radius:15,

        spin:
            Math.random() *
            Math.PI * 2

    });

}


/* ==================================================
   PARTÍCULAS
================================================== */

function particlesAt(
    x,
    y,
    amount,
    color
){

    for(
        let i=0;
        i<amount;
        i++
    ){

        particles.push({

            x:x,
            y:y,

            vx:
                (Math.random()-.5)
                *160,

            vy:
                (Math.random()-.5)
                *160,

            life:.5,

            color:color

        });

    }

}


/* ==================================================
   ATUALIZAR
================================================== */

function update(delta){

    delta =
        Math.min(
            delta,
            .035
        );


    gameTime += delta;


    /* GRAVIDADE */

    bird.velocity +=
        1150 * delta;

    bird.y +=
        bird.velocity * delta;

    bird.rotation +=
        2 * delta;


    if(bird.rotation > 1){

        bird.rotation = 1;

    }


    /* TIMERS */

    cloudTimer -= delta;
    fatalTimer -= delta;
    coinTimer -= delta;


    if(cloudTimer <= 0){

        createNormalCloud();

        cloudTimer =
            1.2 +
            Math.random() * 1.5;

    }


    if(fatalTimer <= 0){

        createFatalCloud();

        fatalTimer =
            2.2 +
            Math.random() * 1.8;

    }


    if(coinTimer <= 0){

        createCoin();

        coinTimer =
            .8 +
            Math.random() * 1.2;

    }


    const speed =
        1 +
        Math.min(
            1.5,
            score / 100
        );


    /* NUVENS */

    for(
        const cloud
        of normalClouds
    ){

        cloud.x -=
            cloud.speed *
            delta *
            speed;

    }


    /* NUVENS FATAIS */

    for(
        const cloud
        of fatalClouds
    ){

        cloud.x -=
            cloud.speed *
            delta *
            speed;

        cloud.pulse +=
            delta * 5;

    }


    /* MOEDAS */

    for(
        const coin
        of coins
    ){

        coin.x -=
            190 *
            delta *
            speed;

        coin.spin +=
            delta * 7;

    }


    /* PEGAR MOEDA */

    for(
        let i=coins.length-1;
        i>=0;
        i--
    ){

        const coin =
            coins[i];


        const distance =
            Math.hypot(
                bird.x - coin.x,
                bird.y - coin.y
            );


        if(
            distance <
            bird.radius +
            coin.radius
        ){

            runCoins++;


            document.getElementById(
                "coins"
            ).textContent =
                runCoins;


            particlesAt(
                coin.x,
                coin.y,
                10,
                "#ffe600"
            );


            coins.splice(
                i,
                1
            );

        }
        else if(
            coin.x < -60
        ){

            coins.splice(
                i,
                1
            );

        }

    }


    /* COLISÃO NUVEM FATAL */

    for(
        const cloud
        of fatalClouds
    ){

        const distance =
            Math.hypot(
                bird.x - cloud.x,
                bird.y - cloud.y
            );


        if(
            distance <
            bird.radius +
            cloud.size * .72
        ){

            particlesAt(
                bird.x,
                bird.y,
                20,
                "#ff3333"
            );


            endGame();

            return;

        }

    }


    normalClouds =
        normalClouds.filter(
            cloud =>
                cloud.x > -150
        );


    fatalClouds =
        fatalClouds.filter(
            cloud =>
                cloud.x > -150
        );


    /* PARTÍCULAS */

    for(
        let i=particles.length-1;
        i>=0;
        i--
    ){

        const p =
            particles[i];


        p.x +=
            p.vx * delta;

        p.y +=
            p.vy * delta;

        p.life -=
            delta;


        if(p.life <= 0){

            particles.splice(
                i,
                1
            );

        }

    }


    /* BORDA */

    if(
        bird.y -
        bird.radius < 0
    ){

        endGame();

        return;

    }


    if(
        bird.y +
        bird.radius >
        H - 45
    ){

        endGame();

        return;

    }


    /* PONTUAÇÃO */

    score =
        Math.floor(
            gameTime * 5
        );


    document.getElementById(
        "score"
    ).textContent =
        score;

}


/* ==================================================
   FUNDO
================================================== */

function drawBackground(){

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );


    if(selectedMap === "desert"){

        gradient.addColorStop(
            0,
            "#f5a33b"
        );

        gradient.addColorStop(
            1,
            "#ffe09a"
        );

    }else{

        gradient.addColorStop(
            0,
            "#58c8e8"
        );

        gradient.addColorStop(
            1,
            "#b9f2ff"
        );

    }


    ctx.fillStyle =
        gradient;


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* SOL */

    ctx.fillStyle =
        selectedMap === "desert"
        ? "#fff1a0"
        : "#ffe36b";


    ctx.beginPath();

    ctx.arc(
        W * .82,
        H * .16,
        38,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* DESERTO */

    if(selectedMap === "desert"){

        ctx.fillStyle =
            "#d99a3d";

        ctx.fillRect(
            0,
            H - 45,
            W,
            45
        );


        /* pequenas dunas */

        ctx.fillStyle =
            "#c6842e";

        for(
            let x=0;
            x<W;
            x+=100
        ){

            ctx.beginPath();

            ctx.arc(
                x,
                H-35,
                45,
                Math.PI,
                0
            );

            ctx.fill();

        }

    }else{

        /* CHÃO NORMAL */

        ctx.fillStyle =
            "#79c94a";

        ctx.fillRect(
            0,
            H - 45,
            W,
            45
        );

    }

}


/* ==================================================
   NUVEM NORMAL
================================================== */

function drawNormalCloud(
    cloud
){

    ctx.save();

    ctx.translate(
        cloud.x,
        cloud.y
    );


    ctx.fillStyle =
        "rgba(255,255,255,.9)";


    ctx.beginPath();

    ctx.arc(
        -40,
        8,
        cloud.size*.65,
        0,
        Math.PI*2
    );

    ctx.arc(
        -10,
        -10,
        cloud.size*.9,
        0,
        Math.PI*2
    );

    ctx.arc(
        25,
        4,
        cloud.size*.75,
        0,
        Math.PI*2
    );

    ctx.arc(
        48,
        12,
        cloud.size*.5,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();

}


/* ==================================================
   NUVEM FATAL
================================================== */

function drawFatalCloud(
    cloud
){

    ctx.save();


    ctx.translate(
        cloud.x,
        cloud.y +
        Math.sin(
            cloud.pulse
        )*3
    );


    ctx.shadowColor =
        "#ff3030";

    ctx.shadowBlur =
        15;


    ctx.fillStyle =
        "#5a5a66";

    ctx.strokeStyle =
        "#292933";

    ctx.lineWidth = 5;


    ctx.beginPath();

    ctx.arc(
        -40,
        8,
        cloud.size*.65,
        0,
        Math.PI*2
    );

    ctx.arc(
        -10,
        -10,
        cloud.size*.9,
        0,
        Math.PI*2
    );

    ctx.arc(
        25,
        4,
        cloud.size*.75,
        0,
        Math.PI*2
    );

    ctx.arc(
        48,
        12,
        cloud.size*.5,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.stroke();


    ctx.shadowBlur = 0;


    /* OLHOS */

    ctx.fillStyle =
        "#ff3333";


    ctx.beginPath();

    ctx.arc(
        -17,
        2,
        6,
        0,
        Math.PI*2
    );

    ctx.arc(
        23,
        2,
        6,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* BOCA */

    ctx.strokeStyle =
        "#ff3333";

    ctx.lineWidth = 4;


    ctx.beginPath();

    ctx.moveTo(
        -22,
        22
    );

    ctx.quadraticCurveTo(
        2,
        37,
        27,
        21
    );

    ctx.stroke();


    ctx.restore();

}


/* ==================================================
   MOEDA
================================================== */

function drawCoin(
    coin
){

    ctx.save();


    ctx.translate(
        coin.x,
        coin.y
    );


    const scale =
        Math.abs(
            Math.cos(
                coin.spin
            )
        );


    ctx.scale(
        Math.max(
            .25,
            scale
        ),
        1
    );


    ctx.fillStyle =
        "#ffd21f";

    ctx.strokeStyle =
        "#b57b00";

    ctx.lineWidth = 3;


    ctx.beginPath();

    ctx.arc(
        0,
        0,
        coin.radius,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.stroke();


    ctx.fillStyle =
        "#fff3a0";

    ctx.font =
        "bold 15px Arial";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";


    ctx.fillText(
        "$",
        0,
        1
    );


    ctx.restore();

}


/* ==================================================
   PÁSSARO
================================================== */

function drawBird(){

    const skin =
        skins[selectedSkin];

    const r =
        bird.radius;


    ctx.save();


    ctx.translate(
        bird.x,
        bird.y
    );


    ctx.rotate(
        bird.rotation
    );


    /* FÊNIX */

    if(selectedSkin === 2){

        ctx.fillStyle =
            "#ff7a00";


        ctx.beginPath();

        ctx.moveTo(
            -r*.3,
            r*.3
        );

        ctx.lineTo(
            -r*1.8,
            r*1.3
        );

        ctx.lineTo(
            -r*1.1,
            0
        );

        ctx.lineTo(
            -r*1.8,
            -r
        );

        ctx.lineTo(
            -r*.3,
            -r*.2
        );

        ctx.fill();

    }


    /* SOMBRIO */

    if(selectedSkin === 5){

        ctx.shadowColor =
            "#8b55ff";

        ctx.shadowBlur =
            18;

    }


    /* CORPO */

    ctx.fillStyle =
        skin.body;


    ctx.beginPath();

    ctx.arc(
        0,
        0,
        r,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.shadowBlur = 0;


    /* ASA */

    ctx.fillStyle =
        skin.wing;


    ctx.beginPath();

    ctx.ellipse(
        -r*.3,
        r*.35,
        r*.75,
        r*.38,
        -.3,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* CAPA */

    if(selectedSkin === 1){

        ctx.fillStyle =
            "#e21b23";


        ctx.beginPath();

        ctx.moveTo(
            -r*.2,
            r*.2
        );

        ctx.lineTo(
            -r*1.7,
            r*1.2
        );

        ctx.lineTo(
            -r,
            0
        );

        ctx.fill();

    }


    /* ROBÔ */

    if(selectedSkin === 3){

        ctx.strokeStyle =
            "#333";

        ctx.lineWidth = 3;


        ctx.strokeRect(
            -r*.65,
            -r*.65,
            r*1.3,
            r*1.3
        );


        ctx.fillStyle =
            "#ff3333";


        ctx.beginPath();

        ctx.arc(
            r*.35,
            -r*.2,
            r*.12,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    /* ALIEN */

    if(selectedSkin === 4){

        ctx.fillStyle =
            "#111";


        ctx.beginPath();

        ctx.ellipse(
            r*.35,
            -r*.2,
            r*.22,
            r*.35,
            -.3,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    /* ROSQUINHA */

    if(selectedSkin === 6){

        ctx.fillStyle =
            "#d87932";


        ctx.beginPath();

        ctx.arc(
            0,
            -r*1.05,
            r*.65,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.fillStyle =
            "#f7b45b";


        ctx.beginPath();

        ctx.arc(
            0,
            -r*1.05,
            r*.38,
            0,
            Math.PI*2
        );

        ctx.fill();


        /* granulado */

        ctx.fillStyle =
            "#ff4b75";

        ctx.fillRect(
            -r*.35,
            -r*1.35,
            5,
            3
        );

        ctx.fillStyle =
            "#4bd6ff";

        ctx.fillRect(
            r*.1,
            -r*1.45,
            5,
            3
        );

    }


    /* WAFFLE */

    if(selectedSkin === 7){

        ctx.fillStyle =
            "#d28b2c";


        ctx.fillRect(
            -r*.7,
            -r*1.55,
            r*1.4,
            r*.65
        );


        ctx.strokeStyle =
            "#8a551c";

        ctx.lineWidth = 3;


        for(
            let i=-2;
            i<=2;
            i++
        ){

            ctx.beginPath();

            ctx.moveTo(
                -r*.65 + i*r*.32,
                -r*1.52
            );

            ctx.lineTo(
                -r*.35 + i*r*.32,
                -r*.95
            );

            ctx.stroke();

        }


        for(
            let i=0;
            i<3;
            i++
        ){

            ctx.beginPath();

            ctx.moveTo(
                -r*.65,
                -r*1.4+i*r*.2
            );

            ctx.lineTo(
                r*.65,
                -r*1.4+i*r*.2
            );

            ctx.stroke();

        }

    }


    /* NATAL */

    if(selectedSkin === 8){

        /* gorro */

        ctx.fillStyle =
            "#e52323";


        ctx.beginPath();

        ctx.moveTo(
            -r*.7,
            -r*.7
        );

        ctx.lineTo(
            r*.55,
            -r*1.55
        );

        ctx.lineTo(
            r*.8,
            -r*.55
        );

        ctx.closePath();

        ctx.fill();


        ctx.fillStyle =
            "white";


        ctx.beginPath();

        ctx.arc(
            r*.57,
            -r*1.55,
            r*.16,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    /* HALLOWEEN */

    if(selectedSkin === 9){

        /* chapéu de bruxa */

        ctx.fillStyle =
            "#4c1b80";


        ctx.beginPath();

        ctx.moveTo(
            -r*.8,
            -r*.65
        );

        ctx.lineTo(
            0,
            -r*1.65
        );

        ctx.lineTo(
            r*.8,
            -r*.65
        );

        ctx.closePath();

        ctx.fill();


        ctx.fillRect(
            -r*.9,
            -r*.72,
            r*1.8,
            r*.18
        );

    }


    /* ANO NOVO */

    if(selectedSkin === 10){

        ctx.fillStyle =
            "#ff55c8";


        for(
            let i=0;
            i<5;
            i++
        ){

            ctx.beginPath();

            ctx.arc(
                (i-2)*r*.45,
                -r*1.15 -
                (i%2)*r*.2,
                r*.08,
                0,
                Math.PI*2
            );

            ctx.fill();

        }

    }


    /* OLHO */

    ctx.fillStyle =
        "white";


    ctx.beginPath();

    ctx.arc(
        r*.45,
        -r*.3,
        r*.28,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle =
        "#111";


    ctx.beginPath();

    ctx.arc(
        r*.52,
        -r*.3,
        r*.12,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* BICO */

    ctx.fillStyle =
        "#ff8c00";


    ctx.beginPath();

    ctx.moveTo(
        r*.75,
        0
    );

    ctx.lineTo(
        r*1.55,
        r*.2
    );

    ctx.lineTo(
        r*.75,
        r*.4
    );

    ctx.closePath();

    ctx.fill();


    ctx.restore();

}


/* ==================================================
   DESENHAR
================================================== */

function draw(){

    drawBackground();


    for(
        const cloud
        of normalClouds
    ){

        drawNormalCloud(
            cloud
        );

    }


    for(
        const cloud
        of fatalClouds
    ){

        drawFatalCloud(
            cloud
        );

    }


    for(
        const coin
        of coins
    ){

        drawCoin(
            coin
        );

    }


    for(
        const p
        of particles
    ){

        ctx.globalAlpha =
            Math.max(
                0,
                p.life*2
            );

        ctx.fillStyle =
            p.color;

        ctx.fillRect(
            p.x,
            p.y,
            5,
            5
        );

    }


    ctx.globalAlpha = 1;

    drawBird();

}


/* ==================================================
   LOOP
================================================== */

function gameLoop(now){

    if(!playing) return;


    const delta =
        (now-lastTime)/1000;


    lastTime = now;


    update(delta);

    draw();


    if(playing){

        requestAnimationFrame(
            gameLoop
        );

    }

}


/* ==================================================
   GAME OVER
================================================== */

function endGame(){

    if(!playing) return;


    playing = false;


    if(score > bestScore){

        bestScore = score;

    }


    totalCoins +=
        runCoins;


    save();


    document.getElementById(
        "finalScore"
    ).textContent =
        score;


    document.getElementById(
        "finalBest"
    ).textContent =
        bestScore;


    document.getElementById(
        "finalCoins"
    ).textContent =
        runCoins;


    document.getElementById(
        "score"
    ).style.display =
        "none";


    document.getElementById(
        "coinHud"
    ).style.display =
        "none";


    document.getElementById(
        "gameOver"
    ).style.display =
        "flex";


    createSkins();

    updateMapButton();

}


/* ==================================================
   INICIAL
================================================== */

resetGame();

draw();
