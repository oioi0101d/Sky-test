<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>SKY BIRD</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    touch-action:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#70c5ce;
    font-family:Arial,sans-serif;
}

#game{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    display:block;
}

#rotate{
    display:none;
    position:fixed;
    inset:0;
    z-index:999;
    background:#111;
    color:white;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:24px;
    font-weight:bold;
    padding:20px;
}

@media (orientation:portrait){

    #rotate{
        display:flex;
    }

    #menu,
    #gameOver,
    #score,
    #coinHud{
        visibility:hidden;
    }
}

#menu{
    position:fixed;
    inset:0;
    z-index:10;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    background:
        linear-gradient(
            #58c8e8,
            #b9f2ff
        );
}

#menu h1{
    color:white;
    font-size:clamp(40px,8vw,75px);
    text-shadow:4px 4px #333;
    margin-bottom:5px;
}

#menu p{
    color:#333;
    font-weight:bold;
    margin:5px;
}

#skins{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:7px;
    max-width:900px;
    padding:8px;
}

.skin{
    min-width:120px;
    padding:9px;

    border:3px solid white;
    border-radius:12px;

    background:#222;
    color:white;

    font-size:15px;
    font-weight:bold;
}

.skin.selected{
    border-color:#ffe600;
    box-shadow:0 0 15px #ffe600;
}

.skin.locked{
    opacity:.4;
}

.menuButtons{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-top:10px;
}

.button{
    padding:13px 28px;

    border:0;
    border-radius:14px;

    background:#35b84a;
    color:white;

    font-size:21px;
    font-weight:bold;
}

.mapButton{
    background:#2878ff;
    min-width:180px;
}

.mapButton.locked{
    background:#555;
}

#score{
    position:fixed;
    z-index:5;

    top:10px;
    left:50%;

    transform:translateX(-50%);

    display:none;

    color:white;
    font-size:clamp(30px,5vw,55px);
    font-weight:bold;

    text-shadow:4px 4px #333;
}

#coinHud{
    position:fixed;
    z-index:5;

    top:15px;
    left:18px;

    display:none;

    color:white;
    font-size:22px;
    font-weight:bold;

    text-shadow:3px 3px #333;
}

#gameOver{
    position:fixed;
    inset:0;
    z-index:20;

    display:none;

    flex-direction:column;
    justify-content:center;
    align-items:center;

    background:rgba(0,0,0,.6);
    color:white;
}

#gameOver h2{
    font-size:clamp(45px,8vw,70px);
    text-shadow:4px 4px #000;
}

#gameOver p{
    font-size:22px;
    margin:6px;
}

</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="rotate">
    📱<br><br>
    VIRE O CELULAR DE LADO<br>
    PARA JOGAR SKY BIRD
</div>

<div id="score">0</div>

<div id="coinHud">
    🪙 <span id="coins">0</span>
</div>

<div id="menu">

    <h1>🐦 SKY BIRD</h1>

    <p>Escolha seu pássaro</p>

    <p>
        🏆 Recorde:
        <span id="best">0</span>
        &nbsp;&nbsp;
        🪙:
        <span id="totalCoins">0</span>
    </p>

    <div id="skins"></div>

    <div class="menuButtons">

        <button
            class="button"
            id="start">
            JOGAR
        </button>

        <button
            class="button mapButton"
            id="mapButton">
            🌤️ NORMAL
        </button>

    </div>

</div>

<div id="gameOver">

    <h2>GAME OVER</h2>

    <p>
        Pontuação:
        <span id="finalScore">0</span>
    </p>

    <p>
        Recorde:
        <span id="finalBest">0</span>
    </p>

    <p>
        🪙 Moedas:
        <span id="finalCoins">0</span>
    </p>

    <button
        class="button"
        id="restart">
        JOGAR NOVAMENTE
    </button>

    <button
        class="button"
        id="backMenu"
        style="background:#555;margin-top:8px;">
        MENU
    </button>

</div>

<script>

/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

let W = 0;
let H = 0;

function resize(){

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W;
    canvas.height = H;

}

resize();

window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   SKINS
===================================================== */

const skins = [

    {
        name:"🐦 Comum",
        unlock:0,
        body:"#ffd21f",
        wing:"#e5aa00"
    },

    {
        name:"🦸 Herói",
        unlock:100,
        body:"#2878ff",
        wing:"#1652b5"
    },

    {
        name:"🔥 Fênix",
        unlock:300,
        body:"#ff4b16",
        wing:"#c83200"
    },

    {
        name:"🤖 Robô",
        unlock:500,
        body:"#9da5ad",
        wing:"#626970"
    },

    {
        name:"👽 Alien",
        unlock:1000,
        body:"#65ff50",
        wing:"#269e28"
    },

    {
        name:"🌑 Sombrio",
        unlock:2000,
        body:"#292333",
        wing:"#15111c"
    },

    {
        name:"🍩 Rosquinha",
        unlock:2500,
        body:"#ff9b45",
        wing:"#d86c25"
    },

    {
        name:"🧇 Waffle",
        unlock:3000,
        body:"#d99a3e",
        wing:"#a96820"
    },

    {
        name:"🎅 Natal",
        unlock:0,
        body:"#e52b2b",
        wing:"#ffffff"
    },

    {
        name:"🎃 Halloween",
        unlock:0,
        body:"#ff7518",
        wing:"#4d245f"
    },

    {
        name:"🥳 Ano Novo",
        unlock:0,
        body:"#f2c230",
        wing:"#8b5cf6"
    }

];


/* =====================================================
   DADOS SALVOS
===================================================== */

let bestScore =
    Number(
        localStorage.getItem("skyBest") || 0
    );

let totalCoins =
    Number(
        localStorage.getItem("skyCoins") || 0
    );

let selectedSkin =
    Number(
        localStorage.getItem("skySkin") || 0
    );

let selectedMap =
    localStorage.getItem("skyMap") || "normal";


if(
    !skins[selectedSkin] ||
    bestScore < skins[selectedSkin].unlock
){
    selectedSkin = 0;
}

if(
    selectedMap !== "normal" &&
    selectedMap !== "desert"
){
    selectedMap = "normal";
}


/* =====================================================
   SALVAR
===================================================== */

function save(){

    localStorage.setItem(
        "skyBest",
        bestScore
    );

    localStorage.setItem(
        "skyCoins",
        totalCoins
    );

    localStorage.setItem(
        "skySkin",
        selectedSkin
    );

    localStorage.setItem(
        "skyMap",
        selectedMap
    );

}


/* =====================================================
   MENU DAS SKINS
===================================================== */

function createSkins(){

    const box =
        document.getElementById("skins");

    box.innerHTML = "";

    skins.forEach(
        (skin,index)=>{

            const button =
                document.createElement("button");

            const unlocked =
                bestScore >= skin.unlock;

            button.className = "skin";

            if(index === selectedSkin){

                button.classList.add(
                    "selected"
                );

            }

            if(!unlocked){

                button.classList.add(
                    "locked"
                );

            }

            if(unlocked){

                button.textContent =
                    skin.name +
                    (
                        skin.unlock > 0
                        ? " ✓"
                        : ""
                    );

                button.onclick =
                    function(){

                        selectedSkin = index;

                        save();

                        createSkins();

                    };

            }else{

                button.textContent =
                    skin.name +
                    " 🔒 " +
                    skin.unlock;

            }

            box.appendChild(button);

        }
    );

    document.getElementById(
        "best"
    ).textContent = bestScore;

    document.getElementById(
        "totalCoins"
    ).textContent = totalCoins;

    updateMapButton();

}

createSkins();


/* =====================================================
   MAPA
===================================================== */

function updateMapButton(){

    const button =
        document.getElementById(
            "mapButton"
        );

    if(bestScore < 2000){

        button.textContent =
            "🌤️ NORMAL";

        button.classList.add(
            "locked"
        );

        return;
    }

    button.classList.remove(
        "locked"
    );

    if(selectedMap === "normal"){

        button.textContent =
            "🌤️ NORMAL";

    }else{

        button.textContent =
            "🏜️ DESERTO";

    }

}


document.getElementById(
    "mapButton"
).onclick =
function(){

    if(bestScore < 2000){

        alert(
            "🏜️ DESERTO BLOQUEADO!\n\n" +
            "Faça 2000 pontos de recorde para desbloquear."
        );

        return;
    }

    if(selectedMap === "normal"){

        selectedMap = "desert";

    }else{

        selectedMap = "normal";

    }

    save();

    updateMapButton();

};


/* =====================================================
   JOGO
===================================================== */

let bird;

let normalClouds = [];
let fatalClouds = [];
let coins = [];
let particles = [];

let score = 0;
let runCoins = 0;

let playing = false;

let lastTime = 0;
let gameTime = 0;

let cloudTimer = 0;
let fatalTimer = 0;
let coinTimer = 0;


/* =====================================================
   RESET
===================================================== */

function resetGame(){

    bird = {

        x:W * .23,

        y:H * .45,

        velocity:0,

        radius:
            Math.max(
                22,
                Math.min(W,H) * .055
            ),

        rotation:0

    };

    normalClouds = [];
    fatalClouds = [];
    coins = [];
    particles = [];

    score = 0;
    runCoins = 0;

    gameTime = 0;

    cloudTimer = .2;
    fatalTimer = 2.5;
    coinTimer = .8;

    document.getElementById(
        "score"
    ).textContent = "0";

    document.getElementById(
        "coins"
    ).textContent = "0";

}


/* =====================================================
   COMEÇAR
===================================================== */

function startGame(){

    resetGame();

    document.getElementById(
        "menu"
    ).style.display = "none";

    document.getElementById(
        "gameOver"
    ).style.display = "none";

    document.getElementById(
        "score"
    ).style.display = "block";

    document.getElementById(
        "coinHud"
    ).style.display = "block";

    playing = true;

    lastTime =
        performance.now();

    requestAnimationFrame(
        gameLoop
    );

}


/* =====================================================
   PULO
===================================================== */

function flap(){

    if(!playing) return;

    bird.velocity = -390;

    bird.rotation = -.5;

}


/* =====================================================
   CONTROLES
===================================================== */

canvas.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        flap();

    }
);

document.addEventListener(
    "keydown",
    function(e){

        if(
            e.code === "Space" ||
            e.code === "ArrowUp"
        ){

            e.preventDefault();

            flap();

        }

    }
);

document.getElementById(
    "start"
).onclick = startGame;

document.getElementById(
    "restart"
).onclick = startGame;

document.getElementById(
    "backMenu"
).onclick =
function(){

    playing = false;

    document.getElementById(
        "gameOver"
    ).style.display = "none";

    document.getElementById(
        "menu"
    ).style.display = "flex";

    document.getElementById(
        "score"
    ).style.display = "none";

    document.getElementById(
        "coinHud"
    ).style.display = "none";

    createSkins();

    resetGame();

    draw();

};


/* =====================================================
   NUVEM NORMAL
===================================================== */

function createNormalCloud(){

    normalClouds.push({

        x:W + 120,

        y:
            60 +
            Math.random() *
            Math.max(
                100,
                H * .60
            ),

        size:
            25 +
            Math.random() * 20,

        speed:
            50 +
            Math.random() * 30

    });

}


/* =====================================================
   NUVEM FATAL
===================================================== */

function createFatalCloud(){

    fatalClouds.push({

        x:W + 150,

        y:
            70 +
            Math.random() *
            Math.max(
                100,
                H * .55
            ),

        size:
            38 +
            Math.random() * 12,

        speed:
            90 +
            Math.random() * 30,

        pulse:0

    });

}


/* =====================================================
   MOEDA
===================================================== */

function createCoin(){

    coins.push({

        x:W + 60,

        y:
            70 +
            Math.random() *
            Math.max(
                100,
                H * .60
            ),

        radius:15,

        spin:
            Math.random() *
            Math.PI * 2

    });

}


/* =====================================================
   PARTÍCULAS
===================================================== */

function particlesAt(
    x,
    y,
    amount,
    color
){

    for(
        let i=0;
        i<amount;
        i++
    ){

        particles.push({

            x:x,
            y:y,

            vx:
                (Math.random()-.5)
                * 160,

            vy:
                (Math.random()-.5)
                * 160,

            life:.5,

            color:color

        });

    }

}


/* =====================================================
   ATUALIZAR
===================================================== */

function update(delta){

    delta =
        Math.min(
            delta,
            .035
        );

    gameTime += delta;


    /* GRAVIDADE */

    bird.velocity +=
        1150 * delta;

    bird.y +=
        bird.velocity * delta;

    bird.rotation +=
        2 * delta;

    bird.rotation =
        Math.max(
            -.5,
            Math.min(
                1,
                bird.rotation
            )
        );


    /* TIMERS */

    cloudTimer -= delta;
    fatalTimer -= delta;
    coinTimer -= delta;


    if(cloudTimer <= 0){

        createNormalCloud();

        cloudTimer =
            1.2 +
            Math.random() * 1.5;

    }


    if(fatalTimer <= 0){

        createFatalCloud();

        fatalTimer =
            2.2 +
            Math.random() * 1.8;

    }


    if(coinTimer <= 0){

        createCoin();

        coinTimer =
            .8 +
            Math.random() * 1.2;

    }


    /* VELOCIDADE */

    const speed =
        1 +
        Math.min(
            1.5,
            score / 100
        );


    /* NUVENS */

    for(
        const cloud of normalClouds
    ){

        cloud.x -=
            cloud.speed *
            delta *
            speed;

    }


    /* NUVENS FATAIS */

    for(
        const cloud of fatalClouds
    ){

        cloud.x -=
            cloud.speed *
            delta *
            speed;

        cloud.pulse +=
            delta * 5;

    }


    /* MOEDAS */

    for(
        const coin of coins
    ){

        coin.x -=
            190 *
            delta *
            speed;

        coin.spin +=
            delta * 7;

    }


    /* PEGAR MOEDA */

    for(
        let i=coins.length-1;
        i>=0;
        i--
    ){

        const coin = coins[i];

        const distance =
            Math.hypot(
                bird.x - coin.x,
                bird.y - coin.y
            );

        if(
            distance <
            bird.radius +
            coin.radius
        ){

            runCoins++;

            document.getElementById(
                "coins"
            ).textContent =
                runCoins;

            particlesAt(
                coin.x,
                coin.y,
                10,
                "#ffe600"
            );

            coins.splice(
                i,
                1
            );

        }
        else if(
            coin.x < -60
        ){

            coins.splice(
                i,
                1
            );

        }

    }


    /* COLISÃO NUVEM FATAL */

    for(
        const cloud of fatalClouds
    ){

        const distance =
            Math.hypot(
                bird.x - cloud.x,
                bird.y - cloud.y
            );

        if(
            distance <
            bird.radius +
            cloud.size * .72
        ){

            particlesAt(
                bird.x,
                bird.y,
                20,
                "#ff3333"
            );

            endGame();

            return;

        }

    }


    /* LIMPEZA */

    normalClouds =
        normalClouds.filter(
            cloud =>
                cloud.x > -180
        );

    fatalClouds =
        fatalClouds.filter(
            cloud =>
                cloud.x > -180
        );


    /* PARTÍCULAS */

    for(
        let i=particles.length-1;
        i>=0;
        i--
    ){

        const p =
            particles[i];

        p.x +=
            p.vx * delta;

        p.y +=
            p.vy * delta;

        p.life -= delta;

        if(p.life <= 0){

            particles.splice(
                i,
                1
            );

        }

    }


    /* BORDA */

    if(
        bird.y -
        bird.radius < 0
    ){

        endGame();

        return;

    }


    if(
        bird.y +
        bird.radius >
        H - 45
    ){

        endGame();

        return;

    }


    /* PONTUAÇÃO */

    score =
        Math.floor(
            gameTime * 5
        );

    document.getElementById(
        "score"
    ).textContent =
        score;


    /* ATUALIZA DESBLOQUEIOS */

    if(score > bestScore){

        bestScore = score;

        document.getElementById(
            "best"
        ).textContent =
            bestScore;

        updateMapButton();

    }

}


/* =====================================================
   FUNDO
===================================================== */

function drawBackground(){

    if(selectedMap === "desert"){

        drawDesert();

    }else{

        drawNormalMap();

    }

}


/* =====================================================
   MAPA NORMAL
===================================================== */

function drawNormalMap(){

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );

    gradient.addColorStop(
        0,
        "#58c8e8"
    );

    gradient.addColorStop(
        1,
        "#b9f2ff"
    );

    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* SOL */

    ctx.fillStyle =
        "#ffe36b";

    ctx.beginPath();

    ctx.arc(
        W * .82,
        H * .16,
        38,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* CHÃO */

    ctx.fillStyle =
        "#79c94a";

    ctx.fillRect(
        0,
        H - 45,
        W,
        45
    );

}


/* =====================================================
   MAPA DESERTO
===================================================== */

function drawDesert(){

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );

    gradient.addColorStop(
        0,
        "#4fc2df"
    );

    gradient.addColorStop(
        1,
        "#ffd078"
    );

    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* SOL */

    ctx.fillStyle =
        "#ffe04b";

    ctx.beginPath();

    ctx.arc(
        W * .82,
        H * .16,
        45,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* AREIA */

    ctx.fillStyle =
        "#e5b65a";

    ctx.fillRect(
        0,
        H - 45,
        W,
        45
    );


    /* CACTOS */

    for(
        let i=0;
        i<7;
        i++
    ){

        const x =
            (i * 190 + 80) % W;

        const base =
            H - 45;

        ctx.fillStyle =
            "#398c3b";

        ctx.fillRect(
            x,
            base - 42,
            11,
            42
        );

        ctx.fillRect(
            x - 12,
            base - 30,
            12,
            8
        );

        ctx.fillRect(
            x + 11,
            base - 21,
            12,
            8
        );

    }

}


/* =====================================================
   NUVEM NORMAL
===================================================== */

function drawNormalCloud(
    cloud
){

    ctx.save();

    ctx.translate(
        cloud.x,
        cloud.y
    );

    ctx.fillStyle =
        "rgba(255,255,255,.9)";

    ctx.beginPath();

    ctx.arc(
        -40,
        8,
        cloud.size * .65,
        0,
        Math.PI * 2
    );

    ctx.arc(
        -10,
        -10,
        cloud.size * .9,
        0,
        Math.PI * 2
    );

    ctx.arc(
        25,
        4,
        cloud.size * .75,
        0,
        Math.PI * 2
    );

    ctx.arc(
        48,
        12,
        cloud.size * .5,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.restore();

}


/* =====================================================
   NUVEM FATAL
===================================================== */

function drawFatalCloud(
    cloud
){

    ctx.save();

    ctx.translate(
        cloud.x,
        cloud.y +
        Math.sin(
            cloud.pulse
        ) * 3
    );

    ctx.shadowColor =
        "#ff3030";

    ctx.shadowBlur = 15;

    ctx.fillStyle =
        "#5a5a66";

    ctx.strokeStyle =
        "#292933";

    ctx.lineWidth = 5;

    ctx.beginPath();

    ctx.arc(
        -40,
        8,
        cloud.size * .65,
        0,
        Math.PI * 2
    );

    ctx.arc(
        -10,
        -10,
        cloud.size * .9,
        0,
        Math.PI * 2
    );

    ctx.arc(
        25,
        4,
        cloud.size * .75,
        0,
        Math.PI * 2
    );

    ctx.arc(
        48,
        12,
        cloud.size * .5,
        0,
        Math.PI * 2
    );

    ctx.fill();
    ctx.stroke();

    ctx.shadowBlur = 0;


    /* OLHOS */

    ctx.fillStyle =
        "#ff3333";

    ctx.beginPath();

    ctx.arc(
        -17,
        2,
        6,
        0,
        Math.PI * 2
    );

    ctx.arc(
        23,
        2,
        6,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* BOCA */

    ctx.strokeStyle =
        "#ff3333";

    ctx.lineWidth = 4;

    ctx.beginPath();

    ctx.moveTo(
        -22,
        22
    );

    ctx.quadraticCurveTo(
        2,
        37,
        27,
        21
    );

    ctx.stroke();

    ctx.restore();

}


/* =====================================================
   MOEDA
===================================================== */

function drawCoin(
    coin
){

    ctx.save();

    ctx.translate(
        coin.x,
        coin.y
    );

    const scale =
        Math.abs(
            Math.cos(
                coin.spin
            )
        );

    ctx.scale(
        Math.max(
            .25,
            scale
        ),
        1
    );

    ctx.fillStyle =
        "#ffd21f";

    ctx.strokeStyle =
        "#b57b00";

    ctx.lineWidth = 3;

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        coin.radius,
        0,
        Math.PI * 2
    );

    ctx.fill();
    ctx.stroke();

    ctx.fillStyle =
        "#fff3a0";

    ctx.font =
        "bold 15px Arial";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.fillText(
        "$",
        0,
        1
    );

    ctx.restore();

}


/* =====================================================
   PÁSSARO
===================================================== */

function drawBird(){

    const skin =
        skins[selectedSkin];

    const r =
        bird.radius;

    ctx.save();

    ctx.translate(
        bird.x,
        bird.y
    );

    ctx.rotate(
        bird.rotation
    );


    /* ROSQUINHA */

    if(selectedSkin === 6){

        ctx.fillStyle =
            "#d88945";

        ctx.beginPath();

        ctx.arc(
            0,
            -r * 1.05,
            r * .48,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.fillStyle =
            "#70c5ce";

        ctx.beginPath();

        ctx.arc(
            0,
            -r * 1.05,
            r * .18,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }


    /* WAFFLE */

    if(selectedSkin === 7){

        ctx.save();

        ctx.translate(
            0,
            -r * .95
        );

        ctx.rotate(-.05);

        ctx.fillStyle =
            "#d99a3e";

        ctx.fillRect(
            -r * .65,
            -r * .35,
            r * 1.3,
            r * .7
        );

        ctx.strokeStyle =
            "#8e581c";

        ctx.lineWidth = 2;

        for(
            let i=-2;
            i<=2;
            i++
        ){

            ctx.beginPath();

            ctx.moveTo(
                i*r*.25,
                -r*.3
            );

            ctx.lineTo(
                i*r*.25,
                r*.3
            );

            ctx.stroke();

        }

        ctx.restore();

    }


    /* FÊNIX */

    if(selectedSkin === 2){

        ctx.fillStyle =
            "#ff7a00";

        ctx.beginPath();

        ctx.moveTo(
            -r*.3,
            r*.3
        );

        ctx.lineTo(
            -r*1.8,
            r*1.3
        );

        ctx.lineTo(
            -r*1.1,
            0
        );

        ctx.lineTo(
            -r*1.8,
            -r
        );

        ctx.lineTo(
            -r*.3,
            -r*.2
        );

        ctx.fill();

    }


    /* SOMBRIO */

    if(selectedSkin === 5){

        ctx.shadowColor =
            "#8b55ff";

        ctx.shadowBlur =
            18;

    }


    /* CORPO */

    ctx.fillStyle =
        skin.body;

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        r,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.shadowBlur = 0;


    /* ASA */

    ctx.fillStyle =
        skin.wing;

    ctx.beginPath();

    ctx.ellipse(
        -r*.3,
        r*.35,
        r*.75,
        r*.38,
        -.3,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* ROBÔ */

    if(selectedSkin === 3){

        ctx.strokeStyle =
            "#333";

        ctx.lineWidth = 3;

        ctx.strokeRect(
            -r*.65,
            -r*.65,
            r*1.3,
            r*1.3
        );

        ctx.fillStyle =
            "#ff3333";

        ctx.beginPath();

        ctx.arc(
            r*.35,
            -r*.2,
            r*.12,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    /* ALIEN */

    if(selectedSkin === 4){

        ctx.fillStyle =
            "#111";

        ctx.beginPath();

        ctx.ellipse(
            r*.35,
            -r*.2,
            r*.22,
            r*.35,
            -.3,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    /* NATAL */

    if(selectedSkin === 8){

        ctx.fillStyle =
            "white";

        ctx.beginPath();

        ctx.arc(
            0,
            -r*.95,
            r*.45,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.fillStyle =
            "#e52b2b";

        ctx.fillRect(
            -r*.45,
            -r*1.25,
            r*.9,
            r*.18
        );

        ctx.beginPath();

        ctx.arc(
            0,
            -r*1.4,
            r*.2,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    /* HALLOWEEN */

    if(selectedSkin === 9){

        ctx.fillStyle =
            "#111";

        ctx.beginPath();

        ctx.arc(
            -r*.3,
            -r*.2,
            r*.13,
            0,
            Math.PI*2
        );

        ctx.arc(
            r*.3,
            -r*.2,
            r*.13,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    /* ANO NOVO */

    if(selectedSkin === 10){

        ctx.strokeStyle =
            "#ffe600";

        ctx.lineWidth = 3;

        for(
            let i=0;
            i<8;
            i++
        ){

            const a =
                i * Math.PI / 4;

            ctx.beginPath();

            ctx.moveTo(
                Math.cos(a)*r*1.1,
                Math.sin(a)*r*1.1
            );

            ctx.lineTo(
                Math.cos(a)*r*1.5,
                Math.sin(a)*r*1.5
            );

            ctx.stroke();

        }

    }


    /* OLHO */

    ctx.fillStyle =
        "white";

    ctx.beginPath();

    ctx.arc(
        r*.45,
        -r*.3,
        r*.28,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle =
        "#111";

    ctx.beginPath();

    ctx.arc(
        r*.52,
        -r*.3,
        r*.12,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* BICO */

    ctx.fillStyle =
        "#ff8c00";

    ctx.beginPath();

    ctx.moveTo(
        r*.75,
        0
    );

    ctx.lineTo(
        r*1.55,
        r*.2
    );

    ctx.lineTo(
        r*.75,
        r*.4
    );

    ctx.closePath();

    ctx.fill();

    ctx.restore();

}


/* =====================================================
   DESENHAR
===================================================== */

function draw(){

    drawBackground();


    for(
        const cloud of normalClouds
    ){

        drawNormalCloud(
            cloud
        );

    }


    for(
        const cloud of fatalClouds
    ){

        drawFatalCloud(
            cloud
        );

    }


    for(
        const coin of coins
    ){

        drawCoin(
            coin
        );

    }


    for(
        const p of particles
    ){

        ctx.globalAlpha =
            Math.max(
                0,
                p.life * 2
            );

        ctx.fillStyle =
            p.color;

        ctx.fillRect(
            p.x,
            p.y,
            5,
            5
        );

    }

    ctx.globalAlpha = 1;

    drawBird();

}


/* =====================================================
   LOOP
===================================================== */

function gameLoop(now){

    if(!playing) return;

    const delta =
        (now-lastTime)/1000;

    lastTime = now;

    update(delta);

    draw();

    if(playing){

        requestAnimationFrame(
            gameLoop
        );

    }

}


/* =====================================================
   GAME OVER
===================================================== */

function endGame(){

    if(!playing) return;

    playing = false;


    if(score > bestScore){

        bestScore = score;

    }


    totalCoins +=
        runCoins;


    save();


    document.getElementById(
        "finalScore"
    ).textContent =
        score;

    document.getElementById(
        "finalBest"
    ).textContent =
        bestScore;

    document.getElementById(
        "finalCoins"
    ).textContent =
        runCoins;


    document.getElementById(
        "score"
    ).style.display =
        "none";

    document.getElementById(
        "coinHud"
    ).style.display =
        "none";

    document.getElementById(
        "gameOver"
    ).style.display =
        "flex";


    createSkins();

    updateMapButton();

}


/* =====================================================
   INICIAL
===================================================== */

resetGame();

draw();

updateMapButton();

</script>
