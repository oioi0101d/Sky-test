<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>SKY BIRD</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;touch-action:none}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#70c5ce;
font-family:Arial,sans-serif
}

#game{
position:fixed;
inset:0;
width:100vw;
height:100vh;
display:block
}

#menu{
position:fixed;
inset:0;
z-index:10;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:linear-gradient(#58c8e8,#b9f2ff)
}

#menu h1{
color:white;
font-size:clamp(45px,9vw,80px);
text-shadow:4px 4px #333
}

#menu p{
color:#333;
font-weight:bold;
margin:6px
}

#skins{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:8px;
max-width:850px;
padding:10px
}

.skin{
min-width:120px;
padding:10px;
border:3px solid white;
border-radius:12px;
background:#222;
color:white;
font-size:16px;
font-weight:bold
}

.skin.selected{
border-color:#ffe600;
box-shadow:0 0 15px #ffe600
}

.skin.locked{
opacity:.4
}

.button{
margin-top:12px;
padding:14px 42px;
border:0;
border-radius:15px;
background:#35b84a;
color:white;
font-size:24px;
font-weight:bold
}

#score{
position:fixed;
z-index:5;
top:12px;
left:50%;
transform:translateX(-50%);
display:none;
color:white;
font-size:clamp(30px,5vw,55px);
font-weight:bold;
text-shadow:4px 4px #333
}

#coinHud{
position:fixed;
z-index:5;
top:18px;
left:20px;
display:none;
color:white;
font-size:22px;
font-weight:bold;
text-shadow:3px 3px #333
}

#gameOver{
position:fixed;
inset:0;
z-index:20;
display:none;
flex-direction:column;
justify-content:center;
align-items:center;
background:rgba(0,0,0,.6);
color:white
}

#gameOver h2{
font-size:clamp(45px,8vw,70px);
text-shadow:4px 4px #000
}

#gameOver p{
font-size:22px;
margin:6px
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="score">0</div>

<div id="coinHud">
🪙 <span id="coins">0</span>
</div>

<div id="menu">

<h1>🐦 SKY BIRD</h1>

<p>Escolha seu pássaro</p>

<p>
🏆 Recorde:
<span id="best">0</span>
&nbsp;&nbsp;
🪙:
<span id="totalCoins">0</span>
</p>

<div id="skins"></div>

<button class="button" id="start">JOGAR</button>

</div>

<div id="gameOver">

<h2>GAME OVER</h2>

<p>
Pontuação:
<span id="finalScore">0</span>
</p>

<p>
Recorde:
<span id="finalBest">0</span>
</p>

<p>
🪙 Moedas:
<span id="finalCoins">0</span>
</p>

<button class="button" id="restart">
JOGAR NOVAMENTE
</button>

<button class="button" id="backMenu">
MENU
</button>

</div>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=0;
let H=0;

function resize(){
W=canvas.width=window.innerWidth;
H=canvas.height=window.innerHeight;
}

resize();
window.addEventListener("resize",resize);


/* =========================
   SKINS
========================= */

const skins=[

{
name:"🐦 Comum",
unlock:0,
body:"#ffd21f",
wing:"#e5aa00"
},

{
name:"🦸 Herói",
unlock:100,
body:"#2878ff",
wing:"#1652b5"
},

{
name:"🔥 Fênix",
unlock:300,
body:"#ff4b16",
wing:"#c83200"
},

{
name:"🤖 Robô",
unlock:500,
body:"#9da5ad",
wing:"#626970"
},

{
name:"👽 Alien",
unlock:1000,
body:"#65ff50",
wing:"#269e28"
},

{
name:"🌑 Sombrio",
unlock:2000,
body:"#292333",
wing:"#15111c"
}

];

let bestScore=
Number(localStorage.getItem("skyBest")||0);

let totalCoins=
Number(localStorage.getItem("skyCoins")||0);

let selectedSkin=
Number(localStorage.getItem("skySkin")||0);

if(!skins[selectedSkin]||
bestScore<skins[selectedSkin].unlock){
selectedSkin=0;
}


/* =========================
   SALVAR
========================= */

function save(){

localStorage.setItem(
"skyBest",
bestScore
);

localStorage.setItem(
"skyCoins",
totalCoins
);

localStorage.setItem(
"skySkin",
selectedSkin
);

}


/* =========================
   MENU
========================= */

function createSkins(){

const box=document.getElementById("skins");

box.innerHTML="";

skins.forEach((skin,index)=>{

const button=document.createElement("button");

const unlocked=
bestScore>=skin.unlock;

button.className="skin";

if(index===selectedSkin)
button.classList.add("selected");

if(!unlocked)
button.classList.add("locked");

if(unlocked){

button.textContent=
skin.name+
(skin.unlock>0?" ✓":"");

button.onclick=function(){

selectedSkin=index;

save();

createSkins();

};

}else{

button.textContent=
skin.name+
" 🔒 "+
skin.unlock;

}

box.appendChild(button);

});

document.getElementById("best").textContent=bestScore;
document.getElementById("totalCoins").textContent=totalCoins;

}

createSkins();


/* =========================
   JOGO
========================= */

let bird;

let normalClouds=[];
let coins=[];
let particles=[];

let score=0;
let runCoins=0;

let playing=false;

let lastTime=0;

let cloudTimer=0;
let coinTimer=0;


/* =========================
   RESET
========================= */

function resetGame(){

bird={
x:W*.23,
y:H*.45,
velocity:0,
radius:Math.max(22,Math.min(W,H)*.055),
rotation:0
};

normalClouds=[];
coins=[];
particles=[];

score=0;
runCoins=0;

cloudTimer=.2;
coinTimer=.8;

document.getElementById("score").textContent="0";
document.getElementById("coins").textContent="0";

}


/* =========================
   COMEÇAR
========================= */

function startGame(){

resetGame();

document.getElementById("menu").style.display="none";
document.getElementById("gameOver").style.display="none";

document.getElementById("score").style.display="block";
document.getElementById("coinHud").style.display="block";

playing=true;

lastTime=performance.now();

requestAnimationFrame(gameLoop);

}


/* =========================
   PULO
========================= */

function flap(){

if(!playing)return;

bird.velocity=-390;
bird.rotation=-.5;

}


/* =========================
   CONTROLES
========================= */

canvas.addEventListener("pointerdown",e=>{
e.preventDefault();
flap();
});

document.addEventListener("keydown",e=>{

if(e.code==="Space"||e.code==="ArrowUp"){
e.preventDefault();
flap();
}

});

document.getElementById("start").onclick=startGame;
document.getElementById("restart").onclick=startGame;

document.getElementById("backMenu").onclick=function(){

playing=false;

document.getElementById("gameOver").style.display="none";
document.getElementById("menu").style.display="flex";

createSkins();

resetGame();

draw();

};


/* =========================
   NUVEM NORMAL
========================= */

function createNormalCloud(){

normalClouds.push({

x:W+100,

y:70+Math.random()*(H*.60),

size:25+Math.random()*20,

speed:45+Math.random()*25

});

}


/* =========================
   MOEDA
========================= */

function createCoin(){

coins.push({

x:W+50,

y:70+Math.random()*(H*.62),

radius:15,

spin:Math.random()*Math.PI*2

});

}


/* =========================
   PARTÍCULAS
========================= */

function particlesAt(x,y,amount,color){

for(let i=0;i<amount;i++){

particles.push({

x:x,
y:y,

vx:(Math.random()-.5)*160,
vy:(Math.random()-.5)*160,

life:.5,
color:color

});

}

}


/* =========================
   ATUALIZAR
========================= */

function update(delta){

delta=Math.min(delta,.035);


/* GRAVIDADE */

bird.velocity+=1150*delta;
bird.y+=bird.velocity*delta;

bird.rotation+=2*delta;

if(bird.rotation>1)
bird.rotation=1;


/* TIMERS */

cloudTimer-=delta;
coinTimer-=delta;


if(cloudTimer<=0){

createNormalCloud();

cloudTimer=
1.2+
Math.random()*1.5;

}


if(coinTimer<=0){

createCoin();

coinTimer=
.6+
Math.random()*.8;

}


/* =========================
   VELOCIDADE 10 MILHÕES
========================= */

const speed=10000000;


/* NUVENS */

for(const cloud of normalClouds){

cloud.x-=
cloud.speed*
delta*
speed;

}


/* MOEDAS */

for(const coin of coins){

coin.x-=
190*
delta*
speed;

coin.spin+=delta*7;

}


/* PEGAR MOEDA */

for(let i=coins.length-1;i>=0;i--){

const coin=coins[i];

const distance=
Math.hypot(
bird.x-coin.x,
bird.y-coin.y
);

if(
distance<
bird.radius+coin.radius
){

runCoins++;

document.getElementById("coins").textContent=runCoins;

particlesAt(
coin.x,
coin.y,
10,
"#ffe600"
);

coins.splice(i,1);

}
else if(coin.x<-60){

coins.splice(i,1);

}

}


/* LIMPEZA */

normalClouds=
normalClouds.filter(
cloud=>cloud.x>-150
);


/* PARTÍCULAS */

for(let i=particles.length-1;i>=0;i--){

const p=particles[i];

p.x+=p.vx*delta;
p.y+=p.vy*delta;
p.life-=delta;

if(p.life<=0)
particles.splice(i,1);

}


/* BORDA */

if(
bird.y-bird.radius<0||
bird.y+bird.radius>H-45
){

endGame();
return;

}


/* =========================
   999.999.999 PONTOS POR SEGUNDO
========================= */

score+=999999999*delta;

score=Math.floor(score);

if(score>bestScore){

bestScore=score;

localStorage.setItem(
"skyBest",
bestScore
);

}

document.getElementById("score").textContent=score;

}


/* =========================
   FUNDO
========================= */

function drawBackground(){

const gradient=
ctx.createLinearGradient(
0,0,0,H
);

gradient.addColorStop(0,"#58c8e8");
gradient.addColorStop(1,"#b9f2ff");

ctx.fillStyle=gradient;

ctx.fillRect(0,0,W,H);


/* SOL */

ctx.fillStyle="#ffe36b";

ctx.beginPath();

ctx.arc(
W*.82,
H*.16,
38,
0,
Math.PI*2
);

ctx.fill();


/* CHÃO */

ctx.fillStyle="#79c94a";

ctx.fillRect(
0,
H-45,
W,
45
);

}


/* =========================
   NUVEM
========================= */

function drawNormalCloud(cloud){

ctx.save();

ctx.translate(
cloud.x,
cloud.y
);

ctx.fillStyle=
"rgba(255,255,255,.9)";

ctx.beginPath();

ctx.arc(
-40,
8,
cloud.size*.65,
0,
Math.PI*2
);

ctx.arc(
-10,
-10,
cloud.size*.9,
0,
Math.PI*2
);

ctx.arc(
25,
4,
cloud.size*.75,
0,
Math.PI*2
);

ctx.arc(
48,
12,
cloud.size*.5,
0,
Math.PI*2
);

ctx.fill();

ctx.restore();

}


/* =========================
   MOEDA
========================= */

function drawCoin(coin){

ctx.save();

ctx.translate(
coin.x,
coin.y
);

const scale=
Math.abs(Math.cos(coin.spin));

ctx.scale(
Math.max(.25,scale),
1
);

ctx.fillStyle="#ffd21f";
ctx.strokeStyle="#b57b00";
ctx.lineWidth=3;

ctx.beginPath();

ctx.arc(
0,
0,
coin.radius,
0,
Math.PI*2
);

ctx.fill();
ctx.stroke();

ctx.fillStyle="#fff3a0";
ctx.font="bold 15px Arial";
ctx.textAlign="center";
ctx.textBaseline="middle";

ctx.fillText("$",0,1);

ctx.restore();

}


/* =========================
   PÁSSARO
========================= */

function drawBird(){

const skin=skins[selectedSkin];
const r=bird.radius;

ctx.save();

ctx.translate(
bird.x,
bird.y
);

ctx.rotate(
bird.rotation
);


/* FÊNIX */

if(selectedSkin===2){

ctx.fillStyle="#ff7a00";

ctx.beginPath();

ctx.moveTo(-r*.3,r*.3);
ctx.lineTo(-r*1.8,r*1.3);
ctx.lineTo(-r*1.1,0);
ctx.lineTo(-r*1.8,-r);
ctx.lineTo(-r*.3,-r*.2);

ctx.fill();

}


/* SOMBRIO */

if(selectedSkin===5){

ctx.shadowColor="#8b55ff";
ctx.shadowBlur=18;

}


/* CORPO */

ctx.fillStyle=skin.body;

ctx.beginPath();

ctx.arc(
0,
0,
r,
0,
Math.PI*2
);

ctx.fill();

ctx.shadowBlur=0;


/* ASA */

ctx.fillStyle=skin.wing;

ctx.beginPath();

ctx.ellipse(
-r*.3,
r*.35,
r*.75,
r*.38,
-.3,
0,
Math.PI*2
);

ctx.fill();


/* CAPA */

if(selectedSkin===1){

ctx.fillStyle="#e21b23";

ctx.beginPath();

ctx.moveTo(-r*.2,r*.2);
ctx.lineTo(-r*1.7,r*1.2);
ctx.lineTo(-r,0);

ctx.fill();

}


/* ROBÔ */

if(selectedSkin===3){

ctx.strokeStyle="#333";
ctx.lineWidth=3;

ctx.strokeRect(
-r*.65,
-r*.65,
r*1.3,
r*1.3
);

ctx.fillStyle="#ff3333";

ctx.beginPath();

ctx.arc(
r*.35,
-r*.2,
r*.12,
0,
Math.PI*2
);

ctx.fill();

}


/* ALIEN */

if(selectedSkin===4){

ctx.fillStyle="#111";

ctx.beginPath();

ctx.ellipse(
r*.35,
-r*.2,
r*.22,
r*.35,
-.3,
0,
Math.PI*2
);

ctx.fill();

}


/* OLHO */

ctx.fillStyle="white";

ctx.beginPath();

ctx.arc(
r*.45,
-r*.3,
r*.28,
0,
Math.PI*2
);

ctx.fill();

ctx.fillStyle="#111";

ctx.beginPath();

ctx.arc(
r*.52,
-r*.3,
r*.12,
0,
Math.PI*2
);

ctx.fill();


/* BICO */

ctx.fillStyle="#ff8c00";

ctx.beginPath();

ctx.moveTo(r*.75,0);
ctx.lineTo(r*1.55,r*.2);
ctx.lineTo(r*.75,r*.4);

ctx.closePath();

ctx.fill();

ctx.restore();

}


/* =========================
   DESENHAR
========================= */

function draw(){

drawBackground();

for(const cloud of normalClouds)
drawNormalCloud(cloud);

for(const coin of coins)
drawCoin(coin);

for(const p of particles){

ctx.globalAlpha=
Math.max(0,p.life*2);

ctx.fillStyle=p.color;

ctx.fillRect(
p.x,
p.y,
5,
5
);

}

ctx.globalAlpha=1;

if(bird)
drawBird();

}


/* =========================
   LOOP
========================= */

function gameLoop(now){

if(!playing)return;

const delta=
(now-lastTime)/1000;

lastTime=now;

update(delta);
draw();

if(playing)
requestAnimationFrame(gameLoop);

}


/* =========================
   GAME OVER
========================= */

function endGame(){

if(!playing)return;

playing=false;

if(score>bestScore)
bestScore=score;

totalCoins+=runCoins;

save();

document.getElementById("finalScore").textContent=score;
document.getElementById("finalBest").textContent=bestScore;
document.getElementById("finalCoins").textContent=runCoins;

document.getElementById("score").style.display="none";
document.getElementById("coinHud").style.display="none";

document.getElementById("gameOver").style.display="flex";

createSkins();

}


/* =========================
   INICIAL
========================= */

resetGame();
draw();

</script>

</body>
</html>
